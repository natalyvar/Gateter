# Blueprint de Render: crea la app y la base de datos con un clic.
# https://render.com/docs/blueprint-spec
#
# IMPORTANTE: `plan: free` es explícito en ambos recursos. Si se omite,
# Render usa por defecto planes de pago.

services:
  - type: web
    name: gateter
    runtime: docker
    plan: free
    region: virginia            # la región disponible más cercana a Colombia
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health/
    # CD: Render solo despliega un commit de main cuando TODOS los checks
    # del CI en GitHub (lint, tests, build de imágenes) han pasado.
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gateter-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true     # Render genera una clave aleatoria segura
      - key: DJANGO_SECURE_COOKIES
        value: "1"              # Render sirve todo por HTTPS
      - key: GUNICORN_WORKERS
        value: "2"              # la instancia free tiene 512 MB de RAM

databases:
  - name: gateter-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"  # misma versión que docker-compose.yml
    databaseName: gateter
    user: gateter
