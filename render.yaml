services:
  - type: web
    name: gateter
    runtime: docker
    plan: free
    region: virginia           
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/health/
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gateter-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true    
      - key: DJANGO_SECURE_COOKIES
        value: "1"              
      - key: GUNICORN_WORKERS
        value: "2"             

databases:
  - name: gateter-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"  
    databaseName: gateter
    user: gateter
