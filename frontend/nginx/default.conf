upstream django {
    server backend:8000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- API y admin de Django -------------------------------------------
    location ~ ^/(api|admin|static)/ {
        proxy_pass http://django;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- Health check del propio Nginx -----------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # --- Assets ------------------------------------------------------------
    # Los archivos no llevan hash en el nombre, así que el navegador debe
    # revalidar siempre (ETag → 304 si no cambiaron) para no servir JS viejo.
    location /assets/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA: cualquier otra ruta (/usuarios/x, /login…) sirve index.html -
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
