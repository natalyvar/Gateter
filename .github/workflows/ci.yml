name: CI

# CI en cada push/PR. El CD lo hace Render: con `autoDeployTrigger: checksPass`
# (ver render.yaml) despliega main solo cuando todos estos jobs pasan.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gateter
          POSTGRES_USER: gateter
          POSTGRES_PASSWORD: gateter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateter" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gateter:gateter@localhost:5432/gateter
      DJANGO_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements/dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verificar sintaxis de los módulos JS
        run: find frontend/src -name '*.js' -print0 | xargs -0 -n1 node --check

  docker:
    name: docker compose
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build y smoke test con docker compose
        run: |
          docker compose up --build -d --wait
          curl --fail --silent http://localhost:8080/api/health/
          curl --fail --silent http://localhost:8080/ | grep -q Gateter
      - if: always()
        run: docker compose down -v

  # Valida la imagen que se despliega en Render ANTES de que Render la use:
  # si este job falla, el check queda en rojo y Render no despliega.
  production-image:
    name: imagen de producción (Render)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f Dockerfile.render -t gateter-prod .
      - name: Smoke test simulando Render (HTTPS en el proxy, $PORT, sin root)
        run: |
          docker run -d --name prod -p 10000:10000 \
            -e PORT=10000 \
            -e DJANGO_SECRET_KEY=ci-only \
            -e DATABASE_URL=sqlite:////tmp/ci.sqlite3 \
            -e RENDER_EXTERNAL_HOSTNAME=gateter.onrender.com \
            -e DJANGO_SECURE_COOKIES=1 \
            gateter-prod
          for i in $(seq 1 30); do
            curl --fail --silent -H "Host: gateter.onrender.com" http://localhost:10000/api/health/ && break
            sleep 2
          done
          H=(-H "Host: gateter.onrender.com" -H "X-Forwarded-Proto: https")
          curl --fail --silent "${H[@]}" http://localhost:10000/api/health/
          curl --fail --silent "${H[@]}" http://localhost:10000/usuarios/alguien | grep -q Gateter
          curl --fail --silent "${H[@]}" http://localhost:10000/api/users/ | grep -q results
          test "$(docker exec prod id -u)" != "0"
      - if: failure()
        run: docker logs prod
